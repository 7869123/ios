name: Swift validation
on:
  push:
    paths-ignore: ['**/*.md', 'validation/**']
  pull_request:
    paths-ignore: ['**/*.md', 'validation/**']
  workflow_dispatch:
    inputs:
      build_apple:
        description: 'Also run Apple package and simulator checks (Core runs by default)'
        type: boolean
        default: false
      build_poc:
        description: 'Require an iOS 27 SDK and compile the diagnostic host (not device acceptance)'
        type: boolean
        default: false
permissions:
  contents: read
env:
  AIUTILITY_LIVE_TESTS: '0'
  AIUTILITY_KEYCHAIN_TESTS: '0'
jobs:
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Real compiler and offline tests with preserved exit codes
        shell: bash
        run: |
          mkdir -p artifacts/core-linux
          set +e
          swift --version > artifacts/core-linux/swift-version.log 2>&1
          version_code=$?
          swift build --package-path Packages/AIUtilityCore > artifacts/core-linux/core-build.log 2>&1
          build_code=$?
          swift test --package-path Packages/AIUtilityCore > artifacts/core-linux/core-tests.log 2>&1
          test_code=$?
          printf 'swift_version=%s\ncore_build=%s\ncore_tests=%s\n' "$version_code" "$build_code" "$test_code" > artifacts/core-linux/exit-codes.txt
          cat artifacts/core-linux/*.log
          test "$version_code" -eq 0 && test "$build_code" -eq 0 && test "$test_code" -eq 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: core-linux-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/core-linux/swift-version.log
            artifacts/core-linux/core-build.log
            artifacts/core-linux/core-tests.log
            artifacts/core-linux/exit-codes.txt
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  apple:
    if: github.event_name != 'workflow_dispatch' || inputs.build_apple || inputs.build_poc
    needs: core-linux
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Validate real macOS packages and both iOS SDK targets
        run: bash scripts/ci_apple.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: apple-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/apple/environment.log
            artifacts/apple/mac-core-tests.log
            artifacts/apple/mac-services-tests.log
            artifacts/apple/ios-simulator-build.log
            artifacts/apple/ios-device-build.log
            artifacts/apple/exit-codes.txt
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  app:
    needs: [core-linux, apple]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Generate and compile the native SwiftUI App
        run: bash scripts/ci_app.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: app-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/app/environment.log
            artifacts/app/generate.log
            artifacts/app/simulator-build.log
            artifacts/app/device-build.log
            artifacts/app/exit-codes.txt
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  poc-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_poc
    needs: core-linux
    # xcode-27 is arm64-only. Run 42364724953 measured macOS 27.0.1, Xcode 27.1 (27A9275), iphoneos27.1;
    # the image README snapshot (Xcode 27.0 beta / iphoneos27.0) was stale.
    # macos-latest still points to the macOS 26 image, whose newest SDK is iphoneos26.5.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Record actual runner, Xcode and SDK versions
        shell: bash
        run: |
          mkdir -p artifacts/poc
          {
            echo "== sw_vers"; sw_vers
            echo "== uname -m"; uname -m
            echo "== xcode-select -p"; xcode-select -p
            echo "== xcodebuild -version"; xcodebuild -version
            echo "== xcodebuild -showsdks"; xcodebuild -showsdks
            echo "== xcrun --sdk iphoneos --show-sdk-version"; xcrun --sdk iphoneos --show-sdk-version
            for sdk in iphoneos iphonesimulator; do
              echo "== ScreenCaptureKit in $sdk SDK"
              ls -d "$(xcrun --sdk "$sdk" --show-sdk-path)/System/Library/Frameworks/ScreenCaptureKit.framework" 2>/dev/null || echo "absent"
            done
          } 2>&1 | tee artifacts/poc/environment.log
      - name: Require iOS 27 SDK
        shell: bash
        run: |
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $version"
          test "${version%%.*}" -ge 27
      - run: brew install xcodegen
      - name: Generate and compile the diagnostic host with preserved exit codes
        id: simbuild
        shell: bash
        working-directory: PoCs/iOS27Capture
        run: |
          set +e
          xcodegen generate --spec project.yml > ../../artifacts/poc/generate.log 2>&1
          generate_code=$?
          xcodebuild -project AIUtilityCaptureProbe.xcodeproj -scheme AIUtilityCaptureProbe -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../artifacts/poc-build CODE_SIGNING_ALLOWED=NO build > ../../artifacts/poc/simulator-build.log 2>&1
          build_code=$?
          printf 'xcodegen_generate=%s\npoc_simulator_build=%s\n' "$generate_code" "$build_code" > ../../artifacts/poc/exit-codes.txt
          cat ../../artifacts/poc/generate.log
          grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\* ' ../../artifacts/poc/simulator-build.log | head -200
          tail -n 40 ../../artifacts/poc/simulator-build.log
          cat ../../artifacts/poc/exit-codes.txt
          printf 'generate=%s\nbuild=%s\n' "$generate_code" "$build_code" >> "$GITHUB_OUTPUT"
          # Do not stop here: the iphoneos archive is an independent compile. The job is
          # failed by the last step if the simulator build failed.
          test "$generate_code" -eq 0
      - name: Archive unsigned Release build for iphoneos
        id: archive
        if: steps.simbuild.outputs.generate == '0'
        shell: bash
        working-directory: PoCs/iOS27Capture
        run: |
          set +e
          xcodebuild archive -project AIUtilityCaptureProbe.xcodeproj -scheme AIUtilityCaptureProbe \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath ../../artifacts/poc-archive/AIUtilityCaptureProbe.xcarchive \
            -derivedDataPath ../../artifacts/poc-archive-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ../../artifacts/poc/archive.log 2>&1
          archive_code=$?
          printf 'poc_device_archive=%s\n' "$archive_code" >> ../../artifacts/poc/exit-codes.txt
          grep -E 'error:|ARCHIVE (SUCCEEDED|FAILED)|\*\* ' ../../artifacts/poc/archive.log | head -200
          tail -n 40 ../../artifacts/poc/archive.log
          test "$archive_code" -eq 0
      - name: Package Payload into PoC-unsigned.ipa
        shell: bash
        run: |
          set -euo pipefail
          archive=artifacts/poc-archive/AIUtilityCaptureProbe.xcarchive
          shopt -s nullglob
          apps=("$archive"/Products/Applications/*.app)
          test "${#apps[@]}" -eq 1 || { echo "expected exactly one .app, found ${#apps[@]}"; exit 1; }
          app="${apps[0]}"
          {
            echo "== app: $(basename "$app")"
            echo "== Info.plist UIBackgroundModes"; plutil -extract UIBackgroundModes json -o - "$app/Info.plist" || echo none
            echo "== code signature (expected unsigned)"; codesign -dv "$app" 2>&1 || true
            echo "== lipo"; lipo -info "$app/$(plutil -extract CFBundleExecutable raw -o - "$app/Info.plist")"
            echo "== all .appex in archive"; find "$archive" -name '*.appex' -print
            echo "== .app/PlugIns"; ls -la "$app/PlugIns" 2>/dev/null || echo "no PlugIns directory (no app extensions)"
          } 2>&1 | tee artifacts/poc/ipa-contents.log
          # Every extension in the archive must live inside the app's PlugIns/ folder.
          stray=$(find "$archive" -name '*.appex' -not -path "$app/PlugIns/*" -print)
          test -z "$stray" || { echo "appex outside .app/PlugIns: $stray"; exit 1; }
          rm -rf artifacts/ipa && mkdir -p artifacts/ipa/Payload
          ditto "$app" "artifacts/ipa/Payload/$(basename "$app")"
          (cd artifacts/ipa && zip -qry PoC-unsigned.ipa Payload)
          unzip -l artifacts/ipa/PoC-unsigned.ipa | tail -n 5 | tee -a artifacts/poc/ipa-contents.log
          shasum -a 256 artifacts/ipa/PoC-unsigned.ipa | tee -a artifacts/poc/ipa-contents.log
      - uses: actions/upload-artifact@v4
        id: ipa
        with:
          name: PoC-unsigned-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ipa/PoC-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: poc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/poc/environment.log
            artifacts/poc/generate.log
            artifacts/poc/simulator-build.log
            artifacts/poc/archive.log
            artifacts/poc/ipa-contents.log
            artifacts/poc/exit-codes.txt
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
      - name: Fail job if the simulator build failed
        if: always() && steps.simbuild.outputs.build != '0'
        shell: bash
        run: |
          echo "simulator build exit code: ${{ steps.simbuild.outputs.build }}"
          exit 1
